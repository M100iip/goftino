<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>گفتینو | پیام‌رسان</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial;background:#101827;color:#fff}
button,input{font:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:12px;background:#38bdf8;color:#082032;font-weight:bold}
input{width:100%;padding:13px;margin:7px 0;border:1px solid #34445b;border-radius:10px;background:#1b2739;color:white}
.card{background:#1b2739;padding:22px;border-radius:18px;margin:20px auto;max-width:460px}
h1{color:#38bdf8;text-align:center}
small,.muted{color:#aab8cc}
.hidden{display:none!important}
.row{display:flex;gap:8px}
.row>*{flex:1}
#app{max-width:900px;margin:auto;padding:12px}
header{display:flex;justify-content:space-between;align-items:center;padding:10px}
.layout{display:grid;grid-template-columns:260px 1fr;gap:12px}
.panel{background:#1b2739;border-radius:16px;padding:14px;min-width:0}
.person{padding:12px;border-radius:10px;background:#25354b;margin:7px 0;cursor:pointer;overflow-wrap:anywhere}
#messages{height:48vh;overflow:auto;display:flex;flex-direction:column;gap:9px;padding:10px}
.msg{background:#25354b;padding:11px;border-radius:12px;max-width:85%;overflow-wrap:anywhere}
.mine{background:#075985;align-self:flex-start}
#status{color:#fbbf24;line-height:1.8}
@media(max-width:650px){.layout{grid-template-columns:1fr}#messages{height:38vh}}
</style>
</head>
<body>

<section id="auth" class="card">
<h1>💬 گفتینو</h1>
<p class="muted">پیام‌رسان خصوصی شما</p>
<input id="email" type="email" placeholder="ایمیل">
<input id="password" type="password" placeholder="رمز عبور (حداقل ۶ نویسه)">
<input id="username" placeholder="نام کاربری (برای ثبت‌نام)">
<div class="row">
<button onclick="signup()">ثبت‌نام</button>
<button onclick="login()">ورود</button>
</div>
<p id="status"></p>
</section>

<section id="app" class="hidden">
<header>
<div><h2>💬 گفتینو</h2><small id="myname"></small></div>
<button onclick="logout()">خروج</button>
</header>

<div class="layout">
<aside class="panel">
<h3>🔎 پیدا کردن کاربر</h3>
<input id="search" placeholder="نام کاربری">
<button onclick="findUsers()" style="width:100%">جست‌وجو</button>
<div id="users"></div>
<hr>
<h3>گفت‌وگوهای من</h3>
<div id="chats"></div>
</aside>

<main class="panel">
<h3 id="chatTitle">یک گفت‌وگو انتخاب کن</h3>
<div id="messages"></div>
<div class="row">
<input id="message" placeholder="پیام خود را بنویس...">
<button onclick="sendMessage()">ارسال</button>
</div>
<p id="chatStatus" class="muted"></p>
</main>
</div>
</section>

<script>
const SUPABASE_URL = "https://sptqoxmschaywfamqfso.supabase.co";
const SUPABASE_KEY = "sb_publishable_gIp4Qtlha0eq2gJ_gEroRg_oAP6goVg";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let me = null;
let activeChat = null;
let activeOther = null;
let poller = null;

function say(t){document.getElementById('status').textContent=t}
function chatSay(t){document.getElementById('chatStatus').textContent=t}

async function signup(){
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const username=document.getElementById('username').value.trim().toLowerCase();
  if(!email||password.length<6||!username){
    say('ایمیل، رمز حداقل ۶ نویسه و نام کاربری را وارد کن.');return;
  }
  if(!/^[a-z0-9_]{3,24}$/.test(username)){
    say('نام کاربری باید ۳ تا ۲۴ حرف انگلیسی، عدد یا _ باشد.');return;
  }
  say('در حال ثبت‌نام...');
  const {data,error}=await db.auth.signUp({email,password});
  if(error){say(error.message);return;}
  if(!data.user){say('ثبت‌نام انجام نشد. دوباره تلاش کن.');return;}
  if(!data.session){
    say('حساب ساخته شد؛ ایمیلت را تأیید کن، سپس وارد شو.');return;
  }
  const {error:pe}=await db.from('profiles').insert({
    id:data.user.id,username
  });
  if(pe){say('حساب ساخته شد، اما ساخت نام کاربری ناموفق بود: '+pe.message);return;}
  await startApp(data.user);
}

async function login(){
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  say('در حال ورود...');
  const {data,error}=await db.auth.signInWithPassword({email,password});
  if(error){say(error.message);return;}
  await startApp(data.user);
}

async function startApp(user){
  me=user;
  const {data:profile,error}=await db.from('profiles')
    .select('username').eq('id',me.id).maybeSingle();
  if(error){say('خطا در دریافت پروفایل: '+error.message);return;}
  if(!profile){
    say('حساب وارد شد، اما پروفایل ندارد. اگر قبلاً ثبت‌نام کرده‌ای، باید نام کاربری برای حسابت ساخته شود.');return;
  }
  document.getElementById('auth').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('myname').textContent='@'+profile.username;
  await loadChats();
}

async function logout(){
  if(poller)clearInterval(poller);
  await db.auth.signOut();
  location.reload();
}

async function findUsers(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const box=document.getElementById('users');
  box.innerHTML='';
  if(q.length<1){box.textContent='نام کاربری را وارد کن.';return;}
  const {data,error}=await db.from('profiles').select('id,username')
    .ilike('username','%'+q+'%').limit(20);
  if(error){box.textContent=error.message;return;}
  const people=(data||[]).filter(p=>p.id!==me.id);
  if(!people.length){box.textContent='کاربری پیدا نشد.';return;}
  people.forEach(p=>{
    const el=document.createElement('div');
    el.className='person';
    el.textContent='@'+p.username+'  ＋ گفت‌وگو';
    el.onclick=()=>openChat(p);
    box.appendChild(el);
  });
}

async function openChat(other){
  chatSay('در حال باز کردن گفت‌وگو...');
  let {data:rows,error}=await db.from('private_chats')
    .select('id,user1,user2')
    .or('user1.eq.'+me.id+',user2.eq.'+me.id);
  if(error){chatSay(error.message);return;}
  let chat=(rows||[]).find(c=>
    (c.user1===me.id&&c.user2===other.id)||
    (c.user2===me.id&&c.user1===other.id)
  );
  if(!chat){
    const {data:newChat,error:ce}=await db.from('private_chats')
      .insert({user1:me.id,user2:other.id}).select().single();
    if(ce){chatSay('ساخت گفت‌وگو ناموفق بود: '+ce.message);return;}
    chat=newChat;
  }
  activeChat=chat.id;
  activeOther=other;
  document.getElementById('chatTitle').textContent='گفت‌وگو با @'+other.username;
  await loadMessages();
  await loadChats();
  if(poller)clearInterval(poller);
  poller=setInterval(loadMessages,4000);
}

async function loadChats(){
  const {data,error}=await db.from('private_chats')
    .select('id,user1,user2')
    .or('user1.eq.'+me.id+',user2.eq.'+me.id);
  const box=document.getElementById('chats');
  box.innerHTML='';
  if(error){box.textContent=error.message;return;}
  for(const c of (data||[])){
    const otherId=c.user1===me.id?c.user2:c.user1;
    const {data:p}=await db.from('profiles').select('id,username')
      .eq('id',otherId).maybeSingle();
    if(!p)continue;
    const el=document.createElement('div');
    el.className='person';
    el.textContent='@'+p.username;
    el.onclick=()=>openChat(p);
    box.appendChild(el);
  }
}

async function loadMessages(){
  if(!activeChat)return;
  const {data,error}=await db.from('private_messages')
    .select('id,sender_id,content,created_at')
    .eq('chat_id',activeChat).order('created_at',{ascending:true});
  if(error){chatSay(error.message);return;}
  const box=document.getElementById('messages');
  box.innerHTML='';
  (data||[]).forEach(m=>{
    const el=document.createElement('div');
    el.className='msg '+(m.sender_id===me.id?'mine':'');
    el.textContent=m.content;
    box.appendChild(el);
  });
  box.scrollTop=box.scrollHeight;
  chatSay('');
}

async function sendMessage(){
  if(!activeChat){chatSay('ابتدا یک گفت‌وگو انتخاب کن.');return;}
  const input=document.getElementById('message');
  const content=input.value.trim();
  if(!content)return;
  const {error}=await db.from('private_messages').insert({
    chat_id:activeChat,sender_id:me.id,content
  });
  if(error){chatSay('ارسال ناموفق: '+error.message);return;}
  input.value='';
  await loadMessages();
}

db.auth.getSession().then(({data})=>{
  if(data.session)startApp(data.session.user);
});
</script>
</body>
 </html>
