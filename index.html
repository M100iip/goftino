<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#176b57">
<title>گفتینو | پیام‌رسان</title>
<style>
:root{--bg:#eef3f1;--panel:#fff;--text:#182a26;--muted:#71817c;--accent:#176b57;--accent2:#1f8b70;--line:#e5ece9;--bubble:#e4f5ed;--shadow:0 12px 35px #183b3020}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#e7f3ef,#f7f9f8);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:16px}
.app{width:min(1050px,100%);height:min(760px,calc(100vh - 32px));min-height:550px;background:var(--panel);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;display:grid;grid-template-columns:320px 1fr;border:1px solid #ffffff}
.sidebar{border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.brand{padding:22px 20px 16px;display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:16px;background:linear-gradient(145deg,var(--accent2),var(--accent));display:grid;place-items:center;color:white;font-size:25px;box-shadow:0 7px 15px #176b5730}.brand h1{font-size:21px;margin:0}.brand p{margin:5px 0 0;font-size:12px;color:var(--muted)}
.search{padding:0 16px 14px}.search input{width:100%;border:1px solid var(--line);background:#f6f9f8;border-radius:13px;padding:12px 14px;font:inherit;outline:none}.section-title{padding:8px 20px;color:var(--muted);font-size:12px}
.chat-list{overflow:auto;padding:0 8px 12px}.chat{width:100%;display:flex;gap:12px;align-items:center;padding:12px;border:0;background:transparent;text-align:right;border-radius:15px;cursor:pointer;font:inherit;color:inherit}.chat:hover,.chat.active{background:#edf7f3}.avatar{flex:0 0 46px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:white;font-size:21px;font-weight:bold;background:linear-gradient(145deg,#5ebaa0,#176b57)}.avatar.purple{background:linear-gradient(145deg,#bd8be5,#7450a4)}.avatar.orange{background:linear-gradient(145deg,#ffc16b,#d97727)}.avatar.blue{background:linear-gradient(145deg,#77b9ee,#3268a8)}.chat-info{min-width:0;flex:1}.chat-name{font-size:14px;font-weight:bold;margin-bottom:7px}.preview{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{font-size:10px;background:var(--accent);color:white;padding:4px 7px;border-radius:20px}
.main{display:flex;flex-direction:column;min-width:0;background:#fbfdfc}.topbar{display:flex;align-items:center;gap:12px;padding:17px 22px;background:#fff;border-bottom:1px solid var(--line)}.topbar .avatar{width:42px;height:42px;flex-basis:42px}.person{flex:1}.person strong{font-size:15px}.person small{display:block;color:var(--accent2);font-size:11px;margin-top:5px}.icon-btn{border:1px solid var(--line);background:white;border-radius:12px;width:38px;height:38px;font-size:18px;cursor:pointer}
.notice{margin:14px auto 0;max-width:90%;text-align:center;font-size:11px;color:#7c6b37;background:#fff7df;border:1px solid #f4e8bc;padding:9px 13px;border-radius:12px;line-height:1.8}
.messages{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:13px;background-image:radial-gradient(#d9e8e2 0.7px,transparent 0.7px);background-size:17px 17px}.day{align-self:center;font-size:10px;color:var(--muted);background:#fff;padding:7px 12px;border-radius:20px;border:1px solid var(--line)}
.msg{max-width:min(78%,430px);padding:11px 13px;border-radius:16px 16px 4px 16px;background:#fff;box-shadow:0 2px 7px #203d3210;line-height:1.8;font-size:13px;overflow-wrap:anywhere}.msg.mine{align-self:flex-start;background:var(--bubble);border-radius:16px 16px 16px 4px}.time{font-size:9px;color:var(--muted);text-align:left;margin-top:5px}
.composer{display:flex;gap:10px;padding:14px 17px;background:#fff;border-top:1px solid var(--line);align-items:center}.composer input{flex:1;min-width:0;border:1px solid var(--line);border-radius:14px;background:#f7faf9;padding:14px;font:inherit;font-size:13px;outline:none}.send{border:0;border-radius:14px;background:var(--accent);color:#fff;padding:0 19px;height:46px;font:inherit;cursor:pointer}.send:hover{background:var(--accent2)}.foot{padding:0 18px 10px;background:#fff;color:#94a19c;font-size:10px;text-align:center}
@media(max-width:650px){body{padding:0;background:#fff}.app{height:100dvh;min-height:0;border-radius:0;border:0;grid-template-columns:112px 1fr}.sidebar{border-left:1px solid var(--line)}.brand{padding:15px 8px;justify-content:center}.brand-copy,.search,.section-title,.preview,.badge{display:none}.chat-list{padding:4px}.chat{flex-direction:column;gap:6px;padding:11px 3px;text-align:center}.avatar{width:43px;height:43px;flex-basis:43px}.chat-name{font-size:10px;white-space:nowrap;max-width:94px;overflow:hidden;text-overflow:ellipsis}.topbar{padding:12px 10px;gap:8px}.topbar .avatar{width:36px;height:36px;flex-basis:36px}.person strong{font-size:12px}.person small{font-size:9px}.icon-btn{width:32px;height:32px}.messages{padding:14px 10px}.msg{max-width:92%;font-size:12px}.composer{padding:10px 8px;gap:6px}.composer input{padding:12px 9px;font-size:12px}.send{padding:0 12px;height:43px;font-size:12px}.notice{font-size:10px;max-width:95%}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="logo">گ</div><div class="brand-copy"><h1>گفتینو</h1><p>گفت‌وگوهایت، یک‌جا</p></div></div>
    <div class="search"><input id="search" placeholder="جست‌وجوی گفتگو..." aria-label="جست‌وجوی گفتگو"></div>
    <div class="section-title">گفتگوهای شما</div>
    <div class="chat-list" id="chatList">
      <button class="chat active" data-chat="عثمان"><div class="avatar">ق</div><div class="chat-info"><div class="chat-name">قیام عثمان</div><div class="preview">سلام! خوش آمدی 👋</div></div><span class="badge">۲</span></button>
      <button class="chat" data-chat="spider"><div class="avatar orange">🕷</div><div class="chat-info"><div class="chat-name">مردعنکبوتی</div><div class="preview">شهر به قهرمان نیاز دارد!</div></div></button>
      <button class="chat" data-chat="batman"><div class="avatar blue">🦇</div><div class="chat-info"><div class="chat-name">وبتمن</div><div class="preview">شب آرامی در گاتهام...</div></div></button>
      <button class="chat" data-chat="friends"><div class="avatar purple">👥</div><div class="chat-info"><div class="chat-name">گروه دوستان</div><div class="preview">برای آخر هفته برنامه داریم؟</div></div></button>
      <button class="chat" data-chat="news"><div class="avatar">📣</div><div class="chat-info"><div class="chat-name">کانال گفتینو</div><div class="preview">به نسخه نمایشی خوش آمدید</div></div></button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar"><div class="avatar" id="topAvatar">ق</div><div class="person"><strong id="topName">قیام عثمان</strong><small id="status">● نمونه نمایشی</small></div><button class="icon-btn" id="infoBtn" title="اطلاعات">ⓘ</button></header>
    <div class="notice">این نسخه، نمونهٔ نمایشی گفتینو است. پیام‌ها فقط در همین مرورگر ذخیره می‌شوند و هنوز به کاربران دیگر ارسال نمی‌شوند.</div>
    <section class="messages" id="messages" aria-live="polite"><div class="day">امروز</div></section>
    <form class="composer" id="composer"><input id="messageInput" autocomplete="off" placeholder="پیامت را بنویس..." aria-label="متن پیام"><button class="send" type="submit">ارسال ➤</button></form>
    <div class="foot">گفتینو • نسخه نمایشی</div>
  </main>
</div>
<script>
const chats={
 عثمان:{name:"قیام عثمان",avatar:"ق",color:"",intro:["سلام! به گفتینو خوش آمدی 👋","اینجا می‌توانی ظاهر پیام‌رسان را امتحان کنی."]},
 spider:{name:"مردعنکبوتی",avatar:"🕷",color:"orange",intro:["سلام رفیق! 🕸","شهر به قهرمان نیاز دارد!"]},
 batman:{name:"وبتمن",avatar:"🦇",color:"blue",intro:["من در سایه‌ها مراقب شهرم.","شب آرامی در گاتهام..."]},
 friends:{name:"گروه دوستان",avatar:"👥",color:"purple",intro:["برای آخر هفته برنامه داریم؟","هرکس پیشنهادی دارد بنویسد!"]},
 news:{name:"کانال گفتینو",avatar:"📣",color:"",intro:["به کانال آزمایشی گفتینو خوش آمدید.","در نسخه‌های بعدی می‌توانیم امکانات بیشتری اضافه کنیم."]}
};
let active="عثمان";
const storageKey="goftino_demo_messages_v1";
let saved={};
try{saved=JSON.parse(localStorage.getItem(storageKey)||"{}")}catch(e){saved={}}
function getMsgs(id){if(!saved[id])saved[id]=chats[id].intro.map((text,i)=>({text,mine:false,time:i===0?"۱۸:۳۰":"۱۸:۳۱"}));return saved[id]}
function save(){try{localStorage.setItem(storageKey,JSON.stringify(saved))}catch(e){}}
function render(){
 const c=chats[active];document.getElementById("topName").textContent=c.name;
 const av=document.getElementById("topAvatar");av.textContent=c.avatar;av.className="avatar "+c.color;
 const box=document.getElementById("messages");box.innerHTML='<div class="day">امروز</div>';
 getMsgs(active).forEach(m=>{const d=document.createElement("div");d.className="msg"+(m.mine?" mine":"");const t=document.createElement("div");t.textContent=m.text;d.appendChild(t);const tm=document.createElement("div");tm.className="time";tm.textContent=m.time;d.appendChild(tm);box.appendChild(d)});
 box.scrollTop=box.scrollHeight;
 document.querySelectorAll(".chat").forEach(b=>b.classList.toggle("active",b.dataset.chat===active));
}
document.querySelectorAll(".chat").forEach(b=>b.addEventListener("click",()=>{active=b.dataset.chat;render()}));
document.getElementById("composer").addEventListener("submit",e=>{e.preventDefault();const input=document.getElementById("messageInput");const text=input.value.trim();if(!text)return;const now=new Date();getMsgs(active).push({text,mine:true,time:now.toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"})});save();input.value="";render();});
document.getElementById("search").addEventListener("input",e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll(".chat").forEach(b=>b.style.display=b.innerText.toLowerCase().includes(q)?"flex":"none")});
document.getElementById("infoBtn").addEventListener("click",()=>alert("گفتینو — نسخه نمایشی\nبرای ارسال واقعی پیام بین کاربران، باید سرور Go و پایگاه داده آنلاین راه‌اندازی شوند."));
render();
</script>
</body>
</html>
