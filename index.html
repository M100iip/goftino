<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>گفتینو</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial;background:#edf2f8;color:#182235}
header{background:#3977f6;color:white;padding:18px}
header h2{margin:0 0 6px}
.container{max-width:650px;margin:auto;background:white;min-height:100vh}
.search{padding:12px}
input{font-family:inherit;font-size:15px}
.search input{width:100%;padding:13px;border:0;border-radius:12px;background:#f0f3f8}
.chat{display:flex;align-items:center;padding:14px;border-bottom:1px solid #eee;cursor:pointer}
.avatar{width:46px;height:46px;border-radius:50%;background:#dce7ff;display:grid;place-items:center;font-size:23px;margin-left:12px}
.info{flex:1;overflow:hidden}
.info strong,.info small{display:block}
.info small{margin-top:7px;color:#7c8799;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#room{display:none;max-width:650px;margin:auto;height:100dvh;flex-direction:column;background:#edf2f8}
.roomhead{background:#3977f6;color:white;padding:12px;display:flex;align-items:center;gap:10px}
.roomhead button{background:none;border:0;color:white;font-size:26px}
#roomName{flex:1}
#status{font-size:11px}
#messages{flex:1;overflow-y:auto;padding:15px}
.bubble{background:white;padding:12px;margin:8px 0;border-radius:14px;max-width:85%;width:fit-content;overflow-wrap:anywhere;box-shadow:0 2px 5px #0001}
.bubble.mine{background:#d9e8ff;margin-right:auto}
.bubble small{display:block;font-size:10px;color:#7b8494;margin-top:6px}
form{display:flex;gap:8px;background:white;padding:12px}
form input{flex:1;min-width:0;border:0;border-radius:24px;background:#f0f3f8;padding:13px}
form button{border:0;border-radius:50%;width:48px;background:#3977f6;color:white;font-size:21px}
#notice{padding:8px;text-align:center;font-size:12px;color:#65718a}
</style>
</head>
<body>
<div class="container" id="home">
<header><h2>💬 گفتینو</h2><div>پیام‌رسان شما</div></header>
<div class="search"><input id="search" placeholder="جست‌وجوی گفتگو..." oninput="renderChats()"></div>
<div id="chats"></div>
<div id="notice">در حال اتصال به پایگاه داده...</div>
</div>

<div id="room">
<div class="roomhead">
<button onclick="goHome()">‹</button>
<div class="avatar" id="roomAvatar">💬</div>
<strong id="roomName">گفتگو</strong>
</div>
<div id="messages"></div>
<form id="form">
<input id="messageInput" placeholder="پیامت را بنویس..." autocomplete="off">
<button type="submit">➤</button>
</form>
</div>

<script>
/* این دو مقدار را با اطلاعات پروژهٔ خود جایگزین کن */
const SUPABASE_URL = "https://sptqoxmschaywfamqfso.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_gIp4Qtlha0eq2gJ_gEroRg_oAP6goVg";

const chats=[
{id:"osman",name:"قیام عثمان",emoji:"⚔️"},
{id:"spider",name:"مردعنکبوتی",emoji:"🕷️"},
{id:"batman",name:"وبتمن",emoji:"🦇"}
];

let active=null;
let messages=[];
let client=null;
let refreshTimer=null;

function renderChats(){
 const q=document.getElementById("search").value.trim();
 const box=document.getElementById("chats");
 box.innerHTML="";
 chats.filter(c=>c.name.includes(q)).forEach(c=>{
  const el=document.createElement("div");
  el.className="chat";
  const av=document.createElement("div");
  av.className="avatar";
  av.textContent=c.emoji;
  const info=document.createElement("div");
  info.className="info";
  const name=document.createElement("strong");
  name.textContent=c.name;
  const last=document.createElement("small");
  last.textContent="برای ورود به گفتگو بزنید";
  info.append(name,last);
  el.append(av,info);
  el.onclick=()=>openChat(c.id);
  box.append(el);
 });
}
renderChats();

function setStatus(t){
 document.getElementById("notice").textContent=t;
}

async function connectDB(){
 if(!SUPABASE_URL.startsWith("https://")||
 !SUPABASE_KEY.startsWith("sb_publishable_")){
  setStatus("آدرس پروژه و کلید عمومی را در کد وارد کن.");
  return;
 }
 try{
  const r=await fetch(SUPABASE_URL+"/rest/v1/messages?select=id&limit=1",{
   headers:{
    "apikey":SUPABASE_KEY,
    "Authorization":"Bearer "+SUPABASE_KEY
   }
  });
  if(!r.ok)throw Error("HTTP "+r.status);
  setStatus("✅ اتصال به پایگاه داده برقرار شد");
 }catch(e){
  setStatus("خطای اتصال: "+e.message);
 }
}

async function loadMessages(){
 if(!active)return;
 try{
  const url=SUPABASE_URL+"/rest/v1/messages?select=id,chat_id,sender,content,created_at&chat_id=eq."+encodeURIComponent(active)+"&order=created_at.asc&limit=200";
  const r=await fetch(url,{
   headers:{
    "apikey":SUPABASE_KEY,
    "Authorization":"Bearer "+SUPABASE_KEY
   }
  });
  if(!r.ok)throw Error("HTTP "+r.status);
  const data=await r.json();
  messages=data;
  renderMessages();
 }catch(e){
  setStatus("دریافت پیام‌ها ناموفق بود: "+e.message);
 }
}

function openChat(id){
 active=id;
 const c=chats.find(x=>x.id===id);
 document.getElementById("home").style.display="none";
 document.getElementById("room").style.display="flex";
 document.getElementById("roomAvatar").textContent=c.emoji;
 document.getElementById("roomName").textContent=c.name;
 loadMessages();
 clearInterval(refreshTimer);
 refreshTimer=setInterval(loadMessages,5000);
}

function renderMessages(){
 const box=document.getElementById("messages");
 box.innerHTML="";
 messages.forEach(m=>{
  const b=document.createElement("div");
  b.className="bubble"+(m.sender==="user"?" mine":"");
  b.append(document.createTextNode(m.content));
  const small=document.createElement("small");
  small.textContent=m.created_at?new Date(m.created_at).toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"}):"";
  b.append(small);
  box.append(b);
 });
 box.scrollTop=box.scrollHeight;
}

document.getElementById("form").addEventListener("submit",async e=>{
 e.preventDefault();
 const input=document.getElementById("messageInput");
 const content=input.value.trim();
 if(!content||!active)return;
 input.disabled=true;
 try{
  const r=await fetch(SUPABASE_URL+"/rest/v1/messages",{
   method:"POST",
   headers:{
    "apikey":SUPABASE_KEY,
    "Authorization":"Bearer "+SUPABASE_KEY,
    "Content-Type":"application/json",
    "Prefer":"return=minimal"
   },
   body:JSON.stringify({
    chat_id:active,
    sender:"user",
    content:content
   })
  });
  if(!r.ok)throw Error("HTTP "+r.status);
  input.value="";
  await loadMessages();
 }catch(e){
  alert("ارسال ناموفق بود: "+e.message);
 }finally{
  input.disabled=false;
  input.focus();
 }
});

function goHome(){
 clearInterval(refreshTimer);
 document.getElementById("room").style.display="none";
 document.getElementById("home").style.display="block";
 renderChats();
}

connectDB();
</script>
</body>
</html>
