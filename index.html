<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>گفتینو</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Tahoma,Arial,sans-serif;
 background:#e9eef5;color:#172033
}
header{
 background:#3977f6;color:white;padding:20px;
 display:flex;justify-content:space-between;align-items:center
}
header h2{margin:0;font-size:23px}
header span{font-size:12px}
.container{max-width:650px;margin:auto;background:white;min-height:100vh}
.search{padding:12px}
.search input{
 width:100%;padding:13px;border:0;border-radius:12px;
 background:#f0f3f8;font-size:15px;outline:none
}
.chat{display:flex;align-items:center;padding:13px;border-bottom:1px solid #eee;cursor:pointer}
.avatar{
 width:48px;height:48px;border-radius:50%;background:#dce7ff;
 display:flex;align-items:center;justify-content:center;
 font-size:24px;margin-left:12px;flex-shrink:0
}
.info{flex:1;min-width:0}
.info strong{display:block;margin-bottom:7px}
.info small{color:#788397}
.time{font-size:11px;color:#8993a5}
#room{display:none;min-height:100vh;flex-direction:column;background:#edf2f8}
.roomhead{display:flex;align-items:center;gap:12px;background:#3977f6;color:white;padding:14px}
.roomhead button{border:0;background:transparent;color:white;font-size:24px}
.roomtitle{flex:1}
.roomtitle strong,.roomtitle small{display:block}
.roomtitle small{margin-top:5px;font-size:11px}
.messages{flex:1;padding:15px;overflow-y:auto}
.bubble{background:white;padding:11px 13px;border-radius:14px 14px 4px 14px;margin:8px 0 8px auto;max-width:85%;width:fit-content;overflow-wrap:anywhere;box-shadow:0 2px 5px #00000008}
.bubble.mine{background:#d9e8ff}
.bubble small{display:block;color:#758197;font-size:10px;margin-top:7px}
.composer{display:flex;gap:8px;padding:12px;background:white}
.composer input{flex:1;min-width:0;border:0;background:#f0f3f8;padding:13px;border-radius:25px;font-size:15px;outline:none}
.composer button{width:48px;border:0;border-radius:50%;background:#3977f6;color:white;font-size:22px}
.newchat{position:fixed;bottom:22px;left:22px;background:#3977f6;color:white;border:0;border-radius:50%;width:58px;height:58px;font-size:27px;box-shadow:0 5px 18px #3977f655}
</style>
</head>

<body>
<div class="container" id="home">
<header>
<div>
<h2>💬 گفتینو</h2>
<span>با هم در ارتباط باشیم</span>
</div>
<div>● آنلاین</div>
</header>

<div class="search">
<input id="search" placeholder="🔍 جست‌وجوی گفتگو..." oninput="renderChats()">
</div>

<div id="chats"></div>
<button class="newchat" onclick="addChat()" title="گفتگوی جدید">＋</button>
</div>

<div id="room">
<div class="roomhead">
<button onclick="goHome()">‹</button>
<div class="avatar" id="roomAvatar">💬</div>
<div class="roomtitle">
<strong id="roomName">گفتگو</strong>
<small>گفتگوی آزمایشی</small>
</div>
</div>

<div class="messages" id="messages"></div>

<form class="composer" id="form">
<input id="messageInput" placeholder="پیامت را بنویس..." autocomplete="off">
<button type="submit">➤</button>
</form>
</div>

<script>
const defaults=[
 {id:1,name:"قیام عثمان",emoji:"⚔️"},
 {id:2,name:"مردعنکبوتی",emoji:"🕷️"},
 {id:3,name:"وبتمن",emoji:"🦇"}
];

let chats=JSON.parse(localStorage.getItem("goftino_chats")||"null")||defaults;
let current=null;

function save(){
 localStorage.setItem("goftino_chats",JSON.stringify(chats));
}

function renderChats(){
 const q=document.getElementById("search").value.trim();
 const box=document.getElementById("chats");
 box.innerHTML="";
 chats.filter(c=>c.name.includes(q)).forEach(c=>{
  const msgs=JSON.parse(localStorage.getItem("goftino_msg_"+c.id)||"[]");
  const last=msgs.length?msgs[msgs.length-1].text:"برای شروع گفتگو بزنید";
  const el=document.createElement("div");
  el.className="chat";
  const avatar=document.createElement("div");
  avatar.className="avatar";
  avatar.textContent=c.emoji;
  const info=document.createElement("div");
  info.className="info";
  const name=document.createElement("strong");
  name.textContent=c.name;
  const preview=document.createElement("small");
  preview.textContent=last;
  info.append(name,preview);
  el.append(avatar,info);
  el.onclick=()=>openChat(c.id);
  box.appendChild(el);
 });
}

function openChat(id){
 current=chats.find(c=>c.id===id);
 if(!current)return;
 document.getElementById("home").style.display="none";
 document.getElementById("room").style.display="flex";
 document.getElementById("roomAvatar").textContent=current.emoji;
 document.getElementById("roomName").textContent=current.name;
 renderMessages();
}

function renderMessages(){
 const box=document.getElementById("messages");
 box.innerHTML="";
 const msgs=JSON.parse(localStorage.getItem("goftino_msg_"+current.id)||"[]");
 msgs.forEach(m=>{
  const b=document.createElement("div");
  b.className="bubble"+(m.mine?" mine":"");
  b.appendChild(document.createTextNode(m.text));
  const time=document.createElement("small");
  time.textContent=m.time;
  b.appendChild(time);
  box.appendChild(b);
 });
 box.scrollTop=box.scrollHeight;
}

document.getElementById("form").addEventListener("submit",e=>{
 e.preventDefault();
 const input=document.getElementById("messageInput");
 const text=input.value.trim();
 if(!text||!current)return;
 const key="goftino_msg_"+current.id;
 const msgs=JSON.parse(localStorage.getItem(key)||"[]");
 msgs.push({
  text:text,mine:true,
  time:new Date().toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"})
 });
 localStorage.setItem(key,JSON.stringify(msgs));
 input.value="";
 renderMessages();
});

function goHome(){
 document.getElementById("room").style.display="none";
 document.getElementById("home").style.display="block";
 renderChats();
}

function addChat(){
 const name=prompt("نام گفتگوی جدید را بنویس:");
 if(!name||!name.trim())return;
 const id=Date.now();
 chats.push({id,name:name.trim(),emoji:"💬"});
 save();
 renderChats();
}

renderChats();
</script>
</body>
</html>
